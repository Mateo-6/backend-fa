AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Ami - Personal Finance App Web Hosting - S3 Only
  
  S3 bucket and CloudFront distribution for web hosting

Resources:
  AmiWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-ami-web-bucket"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  AmiWebBucketOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-ami-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AmiWebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn:
      - AmiWebBucket
      - AmiWebDistribution
    Properties:
      Bucket: !Ref AmiWebBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AmiWebBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AmiWebDistribution}"

  AmiWebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt AmiWebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt AmiWebBucketOAC.Id
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub "CloudFront distribution for ${AWS::StackName} web app"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  AmiWebBucketName:
    Description: "S3 Bucket name for web hosting"
    Value: !Ref AmiWebBucket
  AmiWebCloudFrontURL:
    Description: "CloudFront distribution URL for web app"
    Value: !GetAtt AmiWebDistribution.DomainName
  AmiWebCloudFrontDistributionId:
    Description: "CloudFront distribution ID"
    Value: !Ref AmiWebDistribution
