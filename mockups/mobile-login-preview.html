<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Financial App - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .phone-container {
            width: 100%;
            max-width: 375px;
            background: #000;
            border-radius: 40px;
            padding: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .phone-screen {
            background: #fff;
            border-radius: 32px;
            overflow: hidden;
            min-height: 667px;
            position: relative;
        }

        .status-bar {
            background: #000;
            color: #fff;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .signal-bars {
            display: flex;
            gap: 2px;
            align-items: flex-end;
        }

        .bar {
            width: 3px;
            background: #fff;
            border-radius: 1px;
        }

        .bar:nth-child(1) { height: 4px; }
        .bar:nth-child(2) { height: 6px; }
        .bar:nth-child(3) { height: 8px; }
        .bar:nth-child(4) { height: 10px; }

        .battery {
            width: 24px;
            height: 12px;
            border: 1px solid #fff;
            border-radius: 2px;
            position: relative;
            background: #fff;
        }

        .battery::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 6px;
            background: #fff;
            border-radius: 0 1px 1px 0;
        }

        .battery-fill {
            width: 80%;
            height: 100%;
            background: #4cd964;
            border-radius: 1px;
        }

        .content {
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: calc(100% - 44px);
        }

        .logo-container {
            margin-bottom: 50px;
            text-align: center;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .logo-icon::before {
            content: '$';
            font-size: 48px;
            color: #fff;
            font-weight: bold;
        }

        .app-title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .app-subtitle {
            font-size: 16px;
            color: #666;
            font-weight: 400;
        }

        .login-form {
            width: 100%;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #333;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 20px;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #667eea;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        .error-message {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .login-button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        .loading-spinner.show {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            background: #4cd964;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: #000;
            border-radius: 3px;
        }

        @media (max-width: 480px) {
            .phone-container {
                max-width: 100%;
                border-radius: 0;
                padding: 0;
            }

            .phone-screen {
                border-radius: 0;
            }

            body {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="phone-screen">
            <div class="status-bar">
                <div class="status-left">
                    <span>9:41</span>
                </div>
                <div class="status-right">
                    <div class="signal-bars">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                    <div class="battery">
                        <div class="battery-fill"></div>
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="logo-container">
                    <div class="logo-icon"></div>
                    <h1 class="app-title">Financial App</h1>
                    <p class="app-subtitle">Manage your finances easily</p>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                placeholder="Enter your email"
                                required
                                autocomplete="email"
                            />
                        </div>
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                            />
                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Toggle password visibility"
                            >
                                👁️
                            </button>
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <button type="submit" class="login-button" id="loginButton">
                        <span class="loading-spinner" id="loadingSpinner"></span>
                        <span id="buttonText">Sign In</span>
                    </button>

                    <div class="success-message" id="successMessage">
                        Login successful! Redirecting...
                    </div>

                    <div class="forgot-password">
                        <a href="#" class="forgot-password-link">Forgot password?</a>
                    </div>
                </form>
            </div>

            <div class="home-indicator"></div>
        </div>
    </div>

    <script>
        /**
         * Toggles password visibility
         * @param {HTMLInputElement} passwordInput - The password input element
         * @param {HTMLButtonElement} toggleButton - The toggle button element
         */
        function togglePasswordVisibility(passwordInput, toggleButton) {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleButton.textContent = isPassword ? '🙈' : '👁️';
        }

        /**
         * Validates email format
         * @param {string} email - Email to validate
         * @returns {boolean} True if email is valid
         */
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        /**
         * Shows error message for a field
         * @param {string} fieldId - ID of the field
         * @param {string} message - Error message to display
         */
        function showError(fieldId, message) {
            const errorElement = document.getElementById(`${fieldId}Error`);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
            }
        }

        /**
         * Hides error message for a field
         * @param {string} fieldId - ID of the field
         */
        function hideError(fieldId) {
            const errorElement = document.getElementById(`${fieldId}Error`);
            if (errorElement) {
                errorElement.classList.remove('show');
            }
        }

        /**
         * Sets loading state for the login button
         * @param {boolean} isLoading - Whether the button should be in loading state
         */
        function setLoadingState(isLoading) {
            const loginButton = document.getElementById('loginButton');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const buttonText = document.getElementById('buttonText');

            if (isLoading) {
                loginButton.disabled = true;
                loadingSpinner.classList.add('show');
                buttonText.textContent = 'Signing in...';
            } else {
                loginButton.disabled = false;
                loadingSpinner.classList.remove('show');
                buttonText.textContent = 'Sign In';
            }
        }

        /**
         * Performs login request to the API
         * @param {string} email - User email
         * @param {string} password - User password
         * @returns {Promise<Object>} Response object with token and user data
         */
        async function performLogin(email, password) {
            const baseUrl = 'http://localhost:3000';
            const response = await fetch(`${baseUrl}/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password }),
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.message || 'Invalid credentials');
            }

            return await response.json();
        }

        // Initialize event listeners
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            const successMessage = document.getElementById('successMessage');

            // Password toggle functionality
            passwordToggle.addEventListener('click', () => {
                togglePasswordVisibility(passwordInput, passwordToggle);
            });

            // Clear errors on input
            emailInput.addEventListener('input', () => {
                hideError('email');
            });

            passwordInput.addEventListener('input', () => {
                hideError('password');
            });

            // Form submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Hide previous success message
                successMessage.classList.remove('show');

                // Get form values
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // Validate inputs
                let isValid = true;

                if (!email) {
                    showError('email', 'Email is required');
                    isValid = false;
                } else if (!validateEmail(email)) {
                    showError('email', 'Invalid email format');
                    isValid = false;
                }

                if (!password) {
                    showError('password', 'Password is required');
                    isValid = false;
                }

                if (!isValid) {
                    return;
                }

                // Set loading state
                setLoadingState(true);

                try {
                    // Perform login
                    const result = await performLogin(email, password);

                    // Show success message
                    successMessage.classList.add('show');

                    // Store token (in a real app, you'd use secure storage)
                    if (result.data && result.data.token) {
                        localStorage.setItem('authToken', result.data.token);
                        localStorage.setItem('userData', JSON.stringify(result.data.user));
                    }

                    // Simulate redirect (in a real app, navigate to home screen)
                    setTimeout(() => {
                        alert(`Login successful!\n\nToken: ${result.data?.token?.substring(0, 20)}...\nUser: ${result.data?.user?.email || 'N/A'}\n\n(Preview mode - no actual navigation)`);
                        setLoadingState(false);
                    }, 1500);
                } catch (error) {
                    setLoadingState(false);
                    showError('password', error.message || 'Login failed. Please check your credentials.');
                }
            });
        });
    </script>
</body>
</html>
